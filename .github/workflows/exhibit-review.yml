name: Curiosity exhibit gallery capture
on:
  push:
    branches: ['qa/curiosity-exhibit-capture-2779261']
    paths: ['reviews/runner/**']
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        part: [pc, tablet, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the same pinned libraries as the exhibit
        run: |
          npm install --no-save playwright@1.51.1 three@0.170.0 3dmol@2.5.5
          npx playwright install chromium
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y fonts-noto-cjk
      - name: Inspect the unmodified exhibit over loopback
        env:
          REVIEW_SEGMENT: ${{ matrix.part }}
        run: |
          mkdir -p /tmp/exhibit-pdb
          for id in 1CRN 4HHB 1MBN 1UBQ 1LYZ; do
            curl -fsSL --retry 3 --max-time 40 "https://files.rcsb.org/download/$id.pdb" -o "/tmp/exhibit-pdb/$id.pdb"
          done
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exhibit-http.log 2>&1 &
          trap 'kill "$!" || true' EXIT
          node reviews/runner/supplement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-${{ matrix.part }}
          path: |
            review-result/
            review-raw/
  first-pass:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/curiosity-exhibit-capture-2779261
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: exhibit-*
          github-token: ${{ github.token }}
          run-id: 46001084992
          path: /tmp/first-run
      - name: Assemble primary evidence
        run: |
          mkdir -p review-raw review-result reviews/evidence
          find /tmp/first-run -type f -path '*/review-raw/*' -exec cp -t review-raw {} +
          find /tmp/first-run -type f -path '*/review-result/*' -exec cp -t review-result {} +
          find /tmp/first-run -mindepth 2 -maxdepth 2 -type f -exec cp -t review-result {} +
          python reviews/runner/sheets.py
          cp -r review-result/. reviews/evidence/
          git add -- reviews/evidence
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Record public browser evidence from the isolated runner'
          git push origin HEAD:refs/heads/qa/curiosity-exhibit-capture-2779261
  record:
    needs: [capture, first-pass]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/curiosity-exhibit-capture-2779261
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: exhibit-*
          github-token: ${{ github.token }}
          run-id: 46001084992
          path: /tmp/first-run
      - uses: actions/download-artifact@v4
        with:
          pattern: gallery-*
          path: /tmp/extra-run
      - name: Assemble complete evidence
        run: |
          mkdir -p review-raw review-result reviews/evidence
          find /tmp/first-run -type f -path '*/review-raw/*' -exec cp -t review-raw {} +
          find /tmp/first-run -type f -path '*/review-result/*' -exec cp -t review-result {} +
          find /tmp/first-run -mindepth 2 -maxdepth 2 -type f -exec cp -t review-result {} +
          python reviews/runner/sheets.py
          find /tmp/extra-run -type f -path '*/review-raw/*' -exec cp -t review-raw {} +
          find /tmp/extra-run -type f -path '*/review-result/*' -exec cp -t review-result {} +
          find /tmp/extra-run -mindepth 2 -maxdepth 2 -type f -exec cp -t review-result {} +
          python reviews/runner/merge.py
          python reviews/runner/sheets.py
          cp -r review-result/. reviews/evidence/
          git add -- reviews/evidence
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Record public browser evidence from the isolated runner'
          git push origin HEAD:refs/heads/qa/curiosity-exhibit-capture-2779261
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-gallery-review
          path: |
            review-result/
            review-raw/
