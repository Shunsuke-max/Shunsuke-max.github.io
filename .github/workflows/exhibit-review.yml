name: Curiosity exhibit review capture
on:
  push:
    branches: ['qa/curiosity-exhibit-capture-2779261']
    paths: ['reviews/runner/**']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install review dependencies
        run: |
          npm install --no-save playwright@1.51.1 three@0.170.0 3dmol@2.5.5
          npx playwright install chromium
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y fonts-noto-cjk
      - name: Run the exhibit from a local server
        run: |
          mkdir -p /tmp/exhibit-pdb
          for id in 1CRN 4HHB 1MBN 1UBQ 1LYZ; do
            curl -fsSL --retry 3 --max-time 45 "https://files.rcsb.org/download/$id.pdb" -o "/tmp/exhibit-pdb/$id.pdb"
          done
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/exhibit-http.log 2>&1 &
          trap 'kill "$!" || true' EXIT
          node reviews/runner/capture.mjs
          python3 reviews/runner/sheets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhibit-review-captures
          path: |
            review-result/
            review-raw/
          if-no-files-found: warn
  record:
    runs-on: ubuntu-24.04
    needs: capture
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exhibit-review-captures
          path: /tmp/exhibit-output
      - name: Record public evidence on the capture branch
        run: |
          mkdir -p reviews/evidence
          cp -r /tmp/exhibit-output/review-result/. reviews/evidence/
          git add -- reviews/evidence
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Record browser measurements and review contact sheets'
          git push origin HEAD:refs/heads/qa/curiosity-exhibit-capture-2779261
