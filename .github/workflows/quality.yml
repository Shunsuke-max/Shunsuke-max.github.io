name: Website quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/static.test.mjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install chromium
      - name: Browser checks
        run: |
          python3 -m http.server 4173 > /tmp/curiosity-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser.mjs
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1 three@0.170.0 3dmol@2.5.5
      - run: npx playwright install chromium
      - name: Fetch experimental structures from RCSB
        run: |
          mkdir -p /tmp/curiosity-pdb
          for pdb in 4HHB 1UBQ; do
            curl --fail --location --retry 3 --max-time 45 "https://files.rcsb.org/download/$pdb.pdb" -o "/tmp/curiosity-pdb/$pdb.pdb"
          done
      - name: Render and test 3D scenes
        run: |
          python3 -m http.server 4173 > /tmp/curiosity-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/webgl.mjs
      - name: Save screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
